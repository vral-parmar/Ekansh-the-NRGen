{% include 'header.html' %}
<style >
    .divider:after,
    .divider:before {
    content: "";
    flex: 1;
    height: 1px;
    background: #eee;
    }
    .h-custom {
    height: calc(100% - 73px);
    }
    @media (max-width: 450px) {
    .h-custom {
    height: 100%;
    }
    }
    </style>
<section class="vh-100">
    <div class="container-fluid h-custom">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-md-9 col-lg-6 col-xl-5">
            <img src="https://i.ibb.co/Sxmz1GQ/MT-Section-Stress-free-220401-Copy-3-1024x731.webp"
              class="img-fluid" alt="Sample image">
        </div>
        <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
          <form  method="POST" action="">  
            {{form.hidden_tag()}}
            <div class="form-outline mb-4">
            {{form.username(class="form-control")}}
            </div>
            <div class="form-outline mb-3">
                {{form.password(class="form-control")}}
            </div>  
            <div class="text-center text-lg-start mt-4 pt-2">
                {{form.submit(class="btn btn-outline-primary", style="padding-left: 2.5rem; padding-right: 2.5rem;")}}                
              <p class="small fw-bold mt-2 pt-1 mb-0">Already have an account? <a href="{{url_for('login')}}"
                  class="link-danger">Login</a></p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
</body>
</htm
