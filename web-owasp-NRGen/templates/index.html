<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ekansh report generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
  <style type="text/css">
    body {
      font-family: 'Open Sans', sans-serif;
    }
  </style>
</head>

<body class="bg-light bg-gradient">
  {% include 'header.html' %}


  <div class="container text-center mt-4">
    {% with messages = get_flashed_messages()%}
    {% if messages %}
      {%for msg in messages %}
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        <strong>Opps!! </strong>{{msg}}
      </div>
      {% endfor %}
    {% endif %}
    {% endwith %}
  </div>
  
  <br>
  <div class="container text-center mb-3">
    <div class="container">
      <h3>Upload your Nessus exported CSV report</h3>
    </div><br>
    <div class="container w-50">
      <form method="POST" action="" enctype="multipart/form-data">
        <div class="input-group mb-3">
          <input type="file" class="form-control" name="file" aria-describedby="inputGroupFileAddon04"
            aria-label="Upload" accept=".csv">
          <input type="submit" value="Submit" class="btn btn-outline-secondary">
        </div>
      </form>
    </div>
  </div>
  
  {% include 'footer.html' %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
</body>
</html>
